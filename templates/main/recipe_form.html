{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8">
      <div class="card border-0 shadow rounded-4 p-4 p-md-5">
        <h2 class="fw-bold text-dark mb-4">
          {% if object %}<i class="bi bi-pencil-square me-2"></i>Редагувати рецепт{% else %}<i class="bi bi-plus-circle me-2"></i>Створити новий рецепт{% endif %}
        </h2>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
              Зберегти рецепт
            </button>
            <a href="{% url 'recipe_list' %}" class="btn btn-outline-secondary rounded-pill px-4">
              Скасувати
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
