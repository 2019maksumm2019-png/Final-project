{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-7">
      <div class="card border-0 shadow rounded-4 p-4 p-md-5">
        <h3 class="fw-bold text-dark text-center mb-4">Створення нового рецепта 📝</h3>
        
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          
          <div class="mb-3">
            {{ form.as_p }}
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">Зберегти та опублікувати</button>
            <a href="{% url 'recipe_list' %}" class="btn btn-light rounded-3 text-muted">Скасувати</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
