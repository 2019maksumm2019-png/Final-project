{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card border-0 shadow p-4 rounded-4">
        <h3 class="fw-bold text-danger mb-3">Видалення рецепта</h3>
        <p class="text-secondary mb-4">Ви впевнені, що хочете видалити рецепт <strong>"{{ object.title }}"</strong>? Цю дію не можна скасувати.</p>
        
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger btn-lg rounded-3 px-4 me-2">Так, видалити</button>
          <a href="{{ object.get_absolute_url }}" class="btn btn-light btn-lg rounded-3">Скасувати</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
