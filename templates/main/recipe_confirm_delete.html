{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card border-0 shadow rounded-4 p-5">
        <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
        <h3 class="fw-bold mb-3">Видалення рецепта</h3>
        <p class="text-secondary mb-4">Ви впевнені, що хочете видалити рецепт <strong>"{{ object.title }}"</strong>? Цю дію неможливо скасувати.</p>

        <form method="post" class="d-flex justify-content-center gap-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger rounded-pill px-4 fw-semibold">Так, видалити</button>
          <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary rounded-pill px-4">Скасувати</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
